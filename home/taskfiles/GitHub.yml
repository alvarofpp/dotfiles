# https://taskfile.dev

version: '3'
silent: true

vars:
  PROJECT_OWNER: alvarofpp
  PROJECT_NUMBER: 3
  # Repos de terceiros. O GitHub recusa linkar um projeto pessoal a repo de
  # outro dono ("Only projects owned by the same owner as the repository can
  # be linked"), mas `gh project item-add` atravessa. Lista só a exceção —
  # repo seu entra por `task gh:link`, sem tocar aqui.
  EXTRA_REPOS: >-
    jpbmoura/lucida-monorepo
    mvinnicius22/cozinha-app
  # Defaults aplicados pelo `gh:defaults` em item sem valor. O workflow
  # built-in "Item added to project" está desligado no projeto e não há
  # mutation pra reabilitá-lo, então quem preenche é o `gh:sync`.
  DEFAULT_STATUS: Backlog
  DEFAULT_PRIORITY: P3

tasks:
  repos:
    desc: "List the repos linked to the GitHub Project."
    summary: |
      Lists the repos linked to the GitHub Project.

      Repos seus vêm dos linkados ao projeto — não há lista no código,
      `task gh:link` é como um entra. Repos de terceiros não podem ser
      linkados pelo GitHub e vêm do var EXTRA_REPOS.

      Examples:
        - task gh:repos
    cmds:
      - |
        gh api graphql \
          -f query='query($o:String!,$n:Int!){ user(login:$o){ projectV2(number:$n){ repositories(first:100){ nodes{ nameWithOwner isArchived } } } } }' \
          -f o={{.PROJECT_OWNER}} -F n={{.PROJECT_NUMBER}} \
          --jq '.data.user.projectV2.repositories.nodes[] | select(.isArchived==false) | .nameWithOwner'
        for repo in {{.EXTRA_REPOS}}; do echo "$repo"; done

  link:
    desc: "Link a repo to the GitHub Project. REPO=owner/name (owner optional)."
    summary: |
      Links a repo to the GitHub Project so `task gh:sync` starts picking up
      its issues.

      Arguments:
        - REPO: repo to link. A bare name assumes {{.PROJECT_OWNER}}.

      Examples:
        - task gh:link REPO=cozinha-app
        - task gh:link REPO=lucida-ia/lucida-monorepo
    requires:
      vars: [REPO]
    cmds:
      - |
        case "{{.REPO}}" in
          */*) repo="{{.REPO}}" ;;
          *)   repo="{{.PROJECT_OWNER}}/{{.REPO}}" ;;
        esac
        case "$repo" in
          {{.PROJECT_OWNER}}/*)
            gh project link {{.PROJECT_NUMBER}} --owner {{.PROJECT_OWNER}} --repo "$repo" ;;
          *)
            echo "'$repo' é de outro dono — o GitHub não permite linkar."
            echo "Adicione em EXTRA_REPOS no home/taskfiles/GitHub.yml; o gh:sync cobre o resto."
            exit 1 ;;
        esac

  sync:
    desc: "Add every open issue and PR from the linked repos to the GitHub Project."
    summary: |
      Adds every open issue AND open pull request of every linked repo to the
      GitHub Project. Idempotent: item already on the board is not duplicated.

      Repos come from `task gh:repos`, so a newly linked repo is picked up
      with no edit to this file.

      Examples:
        - task gh:sync
    cmds:
      - |
        task gh:repos | sort -u | while read -r repo; do
          gh issue list -R "$repo" --state open --limit 500 --json url --jq '.[].url'
          gh pr    list -R "$repo" --state open --limit 500 --json url --jq '.[].url'
        done | while read -r url; do
          gh project item-add {{.PROJECT_NUMBER}} --owner {{.PROJECT_OWNER}} --url "$url" >/dev/null \
            && echo "  + $url"
        done
      - task: defaults
      - echo "sync concluído"

  defaults:
    desc: "Fill empty Status/Priority on the board's open items with the defaults."
    summary: |
      Preenche Status e Priority dos itens ABERTOS que estão sem valor, com
      {{.DEFAULT_STATUS}} e {{.DEFAULT_PRIORITY}}. Item que já tem valor não é
      tocado, então rodar de novo é seguro.

      Existe porque o workflow built-in "Item added to project" está desligado
      no projeto e o GitHub não expõe mutation pra religá-lo — o default sai
      daqui, não da UI. Item fechado/merged fica de fora de propósito: o filtro
      da view "All work" já o esconde, e marcá-lo como Backlog seria mentira.

      Chamado no fim do `gh:sync`; rode solto só pra consertar o board.

      Examples:
        - task gh:defaults
    cmds:
      - |
        ids=$(gh api graphql -f query='
          query($o:String!,$n:Int!){ user(login:$o){ projectV2(number:$n){ id
            status:field(name:"Status"){ ... on ProjectV2SingleSelectField{ id options{ id name } } }
            priority:field(name:"Priority"){ ... on ProjectV2SingleSelectField{ id options{ id name } } } } } }' \
          -f o={{.PROJECT_OWNER}} -F n={{.PROJECT_NUMBER}})

        pick() { printf '%s' "$ids" | jq -r --arg f "$1" --arg v "$2" --arg k "$3" \
          'if $k == "field" then .data.user.projectV2[$f].id
           else (.data.user.projectV2[$f].options[] | select(.name | startswith($v)) | .id) end'; }

        project=$(printf '%s' "$ids" | jq -r .data.user.projectV2.id)
        status_field=$(pick status '{{.DEFAULT_STATUS}}' field)
        status_option=$(pick status '{{.DEFAULT_STATUS}}' option)
        prio_field=$(pick priority '{{.DEFAULT_PRIORITY}}' field)
        prio_option=$(pick priority '{{.DEFAULT_PRIORITY}}' option)
        for v in "$project" "$status_field" "$status_option" "$prio_field" "$prio_option"; do
          [ -n "$v" ] || { echo "não resolvi os ids do projeto/campos — abortando"; exit 1; }
        done

        gh api graphql --paginate -f query='
          query($o:String!,$n:Int!,$endCursor:String){ user(login:$o){ projectV2(number:$n){
            items(first:100,after:$endCursor){ pageInfo{ hasNextPage endCursor }
              nodes{ id
                content{ ... on Issue{ state } ... on PullRequest{ state } }
                status:fieldValueByName(name:"Status"){ ... on ProjectV2ItemFieldSingleSelectValue{ name } }
                priority:fieldValueByName(name:"Priority"){ ... on ProjectV2ItemFieldSingleSelectValue{ name } } } } } } }' \
          -f o={{.PROJECT_OWNER}} -F n={{.PROJECT_NUMBER}} \
          --jq '.data.user.projectV2.items.nodes[]
                | select(.content.state == "OPEN")
                | .id + " " + (if .status then "-" else "status" end) + " " + (if .priority then "-" else "priority" end)' \
        | while read -r item want_status want_priority; do
            set -- ; n=0
            [ "$want_status" = "status" ] && { set -- "$@" "$status_field:$status_option"; }
            [ "$want_priority" = "priority" ] && { set -- "$@" "$prio_field:$prio_option"; }
            for pair in "$@"; do
              gh api graphql -f query='
                mutation($p:ID!,$i:ID!,$f:ID!,$v:String!){ updateProjectV2ItemFieldValue(
                  input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$v}}){ clientMutationId } }' \
                -f p="$project" -f i="$item" -f f="${pair%%:*}" -f v="${pair##*:}" >/dev/null
              n=$((n+1))
            done
            [ "$n" -gt 0 ] && echo "  ~ $item ($n campo(s))"
          done
        echo "defaults aplicados"

  unlink:
    desc: "Unlink a repo from the GitHub Project. REPO=owner/name (owner optional)."
    summary: |
      Desliga um repo do projeto — ele para de aparecer no `gh:repos` e o
      `gh:sync` deixa de puxar issues dele. Itens já no board continuam lá;
      remova na UI se quiser.

      Arguments:
        - REPO: repo a desligar. Nome sem barra assume {{.PROJECT_OWNER}}.

      Examples:
        - task gh:unlink REPO=afiliados
    requires:
      vars: [REPO]
    cmds:
      - |
        case "{{.REPO}}" in
          */*) repo="{{.REPO}}" ;;
          *)   repo="{{.PROJECT_OWNER}}/{{.REPO}}" ;;
        esac
        gh project unlink {{.PROJECT_NUMBER}} --owner {{.PROJECT_OWNER}} --repo "$repo"

  orca:
    desc: "Abre uma issue do board numa worktree Orca já linkada. ISSUE=owner/repo#N|url"
    summary: |
      Cria uma worktree Orca pro repo da issue, com a issue linkada no card
      (`linkedIssue`) e um agente já rodando com o contexto dela.

      É o único ponto de contato real entre o board e o Orca: a aba de tasks
      do Orca só fala Linear, mas a worktree guarda o número da issue do
      GitHub. Estado do card volta pro board na mão (ou pelo próprio PR).

      O agente recebe ordem de terminar em PR — é o PR que passa a bola
      pro fluxo de review em Actions. Despachado em lote pelo `gh:dispatch`.

      Arguments:
        - ISSUE: `owner/repo#N` ou a URL da issue.
        - AGENT: agente a subir no primeiro terminal (default: claude).

      Examples:
        - task gh:orca ISSUE=alvarofpp/matria#12
        - task gh:orca ISSUE=https://github.com/alvarofpp/matria/issues/12 AGENT=codex
    requires:
      vars: [ISSUE]
    vars:
      AGENT: '{{.AGENT | default "claude"}}'
    cmds:
      - |
        ref=$(printf '%s' "{{.ISSUE}}" | sed -E 's#^https://github\.com/##; s#/issues/#\##')
        repo="${ref%\#*}"; num="${ref##*\#}"
        title=$(gh issue view "$num" -R "$repo" --json title --jq .title)
        orca worktree create \
          --project "github:$repo" --host local \
          --name "issue-$num" --issue "$num" --comment "$title" \
          --agent "{{.AGENT}}" \
          --prompt "Trabalhe na issue $repo#$num — \"$title\". Leia o enunciado com: gh issue view $num -R $repo --comments. Implemente, rode os testes do projeto e, com tudo verde, faça commit, push e abra o PR com: gh pr create -R $repo --fill --body \"Closes #$num\" --label agente"
        echo "worktree issue-$num criada em $repo e linkada à issue #$num"

  status:
    desc: "Set the Status field of one board item. ITEM=<itemId> VALUE=<option>"
    summary: |
      Move um item do board pra outra coluna. O VALUE casa por prefixo, então
      `VALUE="In Prog"` acha "In Progress".

      Existe pra que o `gh:dispatch` tenha como marcar o card assim que
      despacha — é a mudança de coluna que serve de lock, sem arquivo de
      estado.

      Arguments:
        - ITEM: id do item no projeto (coluna 2 do `task gh:ready`).
        - VALUE: nome (ou prefixo) da opção de Status.

      Examples:
        - task gh:status ITEM=PVTI_xxx VALUE="In Progress"
    requires:
      vars: [ITEM, VALUE]
    cmds:
      - |
        ids=$(gh api graphql -f query='
          query($o:String!,$n:Int!){ user(login:$o){ projectV2(number:$n){ id
            status:field(name:"Status"){ ... on ProjectV2SingleSelectField{ id options{ id name } } } } } }' \
          -f o={{.PROJECT_OWNER}} -F n={{.PROJECT_NUMBER}})

        project=$(printf '%s' "$ids" | jq -r .data.user.projectV2.id)
        field=$(printf '%s' "$ids" | jq -r .data.user.projectV2.status.id)
        option=$(printf '%s' "$ids" | jq -r --arg v '{{.VALUE}}' \
          '.data.user.projectV2.status.options[] | select(.name | startswith($v)) | .id')
        [ -n "$option" ] || { echo "Status '{{.VALUE}}' não existe no board"; exit 1; }

        gh api graphql -f query='
          mutation($p:ID!,$i:ID!,$f:ID!,$v:String!){ updateProjectV2ItemFieldValue(
            input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$v}}){ clientMutationId } }' \
          -f p="$project" -f i="{{.ITEM}}" -f f="$field" -f v="$option" >/dev/null

  ready:
    desc: "List the open issues sitting in Status=Ready. Two columns: ref and itemId."
    summary: |
      Lista as issues ABERTAS na coluna Ready do board, uma por linha, no
      formato `owner/repo#N <itemId>`.

      PR é filtrado de propósito: Ready significa "pronta pra alguém pegar", e
      quem pega PR é o fluxo de review, não o de implementação.

      É a fonte do `gh:dispatch`. Rode solto pra ver o que está na fila.

      Examples:
        - task gh:ready
    cmds:
      - |
        gh api graphql --paginate -f query='
          query($o:String!,$n:Int!,$endCursor:String){ user(login:$o){ projectV2(number:$n){
            items(first:100,after:$endCursor){ pageInfo{ hasNextPage endCursor }
              nodes{ id
                content{ __typename ... on Issue{ number state repository{ nameWithOwner } } }
                status:fieldValueByName(name:"Status"){ ... on ProjectV2ItemFieldSingleSelectValue{ name } } } } } } }' \
          -f o={{.PROJECT_OWNER}} -F n={{.PROJECT_NUMBER}} \
          --jq '.data.user.projectV2.items.nodes[]
                | select(.content.__typename == "Issue")
                | select(.content.state == "OPEN")
                | select(.status.name // "" | startswith("Ready"))
                | .content.repository.nameWithOwner + "#" + (.content.number|tostring) + " " + .id'

  dispatch:
    desc: "Abre uma worktree Orca pra cada issue em Ready e move o card pra In progress."
    summary: |
      O gatilho do fluxo autônomo: toda issue que você arrasta pra Ready no
      board vira uma worktree Orca com um agente já trabalhando nela.

      A mudança pra "In progress" é o lock — acontece ANTES de criar a
      worktree, então o tick seguinte do timer não despacha a mesma issue duas
      vezes. Se a criação falhar, o card volta pra Ready.

      Só roda com a stack `svc:` de pé — ver `gh:agents-ready`. Sem ela a task
      sai em silêncio e o card fica em Ready pro próximo tick; não é erro, é o
      piloto automático desligado.

      Chamado pelo timer `gh-board-defaults.timer` a cada 15 min.

      Arguments:
        - AGENT: agente a subir na worktree (default: claude).

      Examples:
        - task gh:dispatch
    vars:
      AGENT: '{{.AGENT | default "claude"}}'
    cmds:
      - |
        task gh:agents-ready || exit 0

        task gh:ready | while read -r ref item; do
          task gh:review-ready REPO="${ref%\#*}" || continue
          echo "→ $ref"
          task gh:labels REPO="${ref%\#*}"
          task gh:status ITEM="$item" VALUE="In Progress"
          if ! task gh:orca ISSUE="$ref" AGENT={{.AGENT}}; then
            echo "  falhou — devolvendo o card pra Ready"
            task gh:status ITEM="$item" VALUE="Ready"
          fi
        done

  agents-ready:
    desc: "Precondição do fluxo autônomo: stack svc de pé e runtime do Orca alcançável."
    summary: |
      A stack `svc:` de pé é o **consentimento**: enquanto ela não está rodando,
      nenhum agente é despachado sozinho nesta máquina. Não é um teste técnico
      de dependência — o fluxo não usa Traefik pra nada — é o interruptor.
      `task svc:down` desliga o piloto automático inteiro.

      Com o consentimento dado, o runtime do Orca é consequência: se estiver
      fora, esta task sobe o `orca-serve.service` e espera ele responder. Sem
      isso, trocar o gate não resolveria nada — o `worktree create` falharia
      igual e o card só ficaria batendo de Ready pra Ready.

      O `orca serve` precisa de unit própria, não de `&` no fim da linha: o
      timer é `Type=oneshot` e o systemd mata o que sobrar no cgroup quando o
      ExecStart termina.

      Sai não-zero (com o motivo) quando não dá pra despachar. Chamado pelo
      `gh:dispatch` e pelo `gh:pr-tick`; rode solto pra saber por que o fluxo
      está parado.

      Examples:
        - task gh:agents-ready
    cmds:
      - |
        if [ -z "$(docker ps -q --filter name=svc-traefik --filter status=running)" ]; then
          echo "stack svc: fora do ar — fluxo autônomo desligado (task svc:up pra ligar)"
          exit 1
        fi

        if ! orca status 2>/dev/null | grep -q '^runtimeReachable: true'; then
          echo "subindo o runtime do Orca..."
          systemctl --user start orca-serve.service || true
          n=0
          while [ "$n" -lt 15 ]; do
            sleep 2; n=$((n+1))
            orca status 2>/dev/null | grep -q '^runtimeReachable: true' && break
          done
        fi

        if ! orca status 2>/dev/null | grep -q '^runtimeReachable: true'; then
          echo "runtime do Orca não respondeu — nada despachado (journalctl --user -u orca-serve)"
          exit 1
        fi

  review-ready:
    desc: "Diz se um repo cumpre o pré-requisito do fluxo: AGENTS.md válido. REPO=owner/name"
    summary: |
      O `AGENTS.md` é **pré-requisito** pra o repo entrar no fluxo autônomo: é
      dele que o `/review-pr` tira quem revisa o quê. Sem ele o revisor não tem
      nada além de "revise o diff", que é o pior review possível — pior do que
      não revisar, porque carimba o PR de revisado.

      Por isso o `gh:dispatch` e o `gh:pr-tick` pulam o repo em vez de degradar
      a revisão. Escrever o arquivo é o `/agents-doc` (comando global).

      O caminho local sai do `orca repo list` — é o mesmo registro que o
      `gh:orca` usa pra criar worktree, então repo que o fluxo consegue
      despachar é repo que ele consegue conferir.

      Arguments:
        - REPO: `owner/name` (ou só `name`).

      Examples:
        - task gh:review-ready REPO=alvarofpp/matria
    requires:
      vars: [REPO]
    cmds:
      - |
        nome=$(printf '%s' "{{.REPO}}" | sed 's#.*/##')
        path=$(orca repo list 2>/dev/null | awk -v n="$nome" '$2 == n {print $3}' | head -1)
        if [ -z "$path" ]; then
          echo "  ! $nome: não está registrado no Orca — o fluxo não tem checkout local pra conferir"
          exit 1
        fi
        if ! task ai:agents-doc REPO="$path" MODE=check >/dev/null 2>&1; then
          echo "  ! $nome: AGENTS.md ausente ou inválido — rode /agents-doc lá (pré-requisito do fluxo)"
          exit 1
        fi

  labels:
    desc: "Cria (idempotente) os labels de estado do fluxo de agentes num repo. REPO=owner/name"
    summary: |
      O fluxo de PR não tem banco: o estado mora nos labels do próprio PR,
      visível na UI do GitHub e legível por uma chamada de `gh`.

        agente            no fluxo (posto pelo agente ao abrir o PR)
        agente:rodando    já tem agente trabalhando — o tick não despacha outro
        agente:mudancas   revisor pediu alteração; a bola é do autor
        agente:humano     terminal: estourou o teto de rodadas ou deu ruim

      Não existe label de "aprovado". Review `APPROVED` é impossível no próprio
      PR e, com tudo rodando na sua máquina, autor e revisor são a mesma conta
      do GitHub — então a aprovação é o merge em si, não um estado.

      `--force` torna a criação idempotente. Chamado pelo `gh:dispatch`, então
      repo novo entra no fluxo sem passo manual.

      Arguments:
        - REPO: owner/name do repositório.

      Examples:
        - task gh:labels REPO=alvarofpp/matria
    requires:
      vars: [REPO]
    cmds:
      - |
        printf '%s\n' \
          'agente|0e8a16|no fluxo de agentes' \
          'agente:rodando|fbca04|agente trabalhando agora' \
          'agente:mudancas|d93f0b|revisor pediu alteração' \
          'agente:humano|b60205|precisa de você' \
        | while IFS='|' read -r name color desc; do
            gh label create "$name" -R "{{.REPO}}" --color "$color" --description "$desc" --force >/dev/null
          done

  prs:
    desc: "List the agent-flow PRs and the action each one is waiting for."
    summary: |
      Lista os PRs abertos com o label `agente`, um por linha, no formato
      `owner/repo#N <acao>`. Fonte do `gh:pr-tick`; rode solto pra ver a fila
      sem despachar nada.

      A ação sai dos labels: `agente:humano` e `agente:rodando` são filtrados
      (não há o que fazer agora), `agente:mudancas` pede `corrigir`, o resto
      pede `revisar`. PR sem o label `agente` é seu — o fluxo não encosta.

      Examples:
        - task gh:prs
    cmds:
      - |
        task gh:repos | sort -u | while read -r repo; do
          gh pr list -R "$repo" --state open --label agente --limit 100 --json number,labels \
            --jq '.[] | [.labels[].name] as $l
              | select(($l | index("agente:humano")) == null)
              | select(($l | index("agente:rodando")) == null)
              | (.number|tostring) + " "
                + (if ($l | index("agente:mudancas")) then "corrigir" else "revisar" end)' \
            2>/dev/null | while read -r num action; do echo "$repo#$num $action"; done
        done

  pr-tick:
    desc: "Despacha um agente pra cada PR do fluxo que está esperando ação."
    summary: |
      Os passos 2–5 do fluxo autônomo (revisar → corrigir → re-revisar →
      mergear), rodando na SUA máquina. A decisão de 2026-08-27 foi não usar
      GitHub Actions: o loop gasta várias sessões de agente por PR e estouraria
      os minutos grátis em repo privado.

      Pra cada PR listado pelo `gh:prs`:

        revisar   → primeira passada: `/review-pr <n>` + `--post`. Terminal NOVO
                    na worktree — contexto limpo é o que mantém o revisor
                    independente do autor, mesmo no mesmo checkout.
        corrigir  → o autor lê as threads, aplica, faz push e tira o
                    `agente:mudancas`, devolvendo o PR pra fila.
        recheck   → `revisar` num PR que já tem review vira `/review-pr --check`:
                    confere achado por achado se foi atendido e fecha as threads
                    resolvidas, em vez de revisar tudo de novo do zero.

      Aprovado em qualquer uma das duas rodadas de revisão, o próprio agente
      traz a main, resolve conflito e mergeia — não há review `APPROVED` porque
      autor e revisor são a mesma conta do GitHub.

      O label `agente:rodando` é o lock, posto aqui antes de abrir o terminal e
      removido pelo agente no fim. Sem ele o tick de 15 min empilharia um
      segundo agente em cima do primeiro.

      Teto de {{.MAX_ROUNDS}} rodadas de review por PR: ping-pong infinito
      entre revisor e autor é o modo de falha esperado, não hipótese. Estourou,
      o PR ganha `agente:humano` e o fluxo larga.

      A worktree é resolvida por `issue:<N>`, o vínculo que o `gh:orca` gravou
      no card do Orca — daí o `Closes #N` obrigatório no corpo do PR.

      A revisão em si é o `/review-pr` global (`ai/.claude/commands/`), portado
      do lucida-monorepo: worktree próprio no head do PR, 1 a 5 revisores em
      paralelo escolhidos pelos agentes do repo, um compilador que deduplica e
      corta achado sem evidência, e um `--check` que confere item a item o que
      foi pedido e fecha as threads resolvidas. Repo com `/review-pr` próprio
      (o lucida tem) usa o dele — comando de projeto ganha do global.

      Arguments:
        - CLAUDE_FLAGS: flags extras do agente. Vazio por default: as permissões
          já vêm do `~/.claude/settings.json` global, que libera `git` e `gh`.

      Examples:
        - task gh:pr-tick
    vars:
      MAX_ROUNDS: 3
      CLAUDE_FLAGS: '{{.CLAUDE_FLAGS | default ""}}'
    cmds:
      - |
        task gh:agents-ready || exit 0

        task gh:prs | while read -r ref action; do
          repo="${ref%\#*}"; num="${ref##*\#}"
          task gh:review-ready REPO="$repo" || continue

          issue=$(gh pr view "$num" -R "$repo" --json body --jq .body \
            | grep -oiE 'closes #[0-9]+' | head -1 | grep -oE '[0-9]+')
          if [ -z "$issue" ]; then
            echo "$ref: sem 'Closes #N' no corpo — não sei qual worktree usar, pulando"
            continue
          fi

          rounds=$(gh pr view "$num" -R "$repo" --json reviews --jq '.reviews | length')
          if [ "$rounds" -ge {{.MAX_ROUNDS}} ]; then
            echo "$ref: {{.MAX_ROUNDS}} rodadas sem convergir — passando pra você"
            gh pr edit "$num" -R "$repo" --add-label agente:humano >/dev/null
            continue
          fi

          # PR que já passou por revisor não é revisto do zero: o `/review-pr --check`
          # confere item a item o que foi pedido, e só ele fecha as threads resolvidas.
          [ "$action" = "revisar" ] && [ "$rounds" -gt 0 ] && action=recheck

          if ! orca worktree show --worktree "issue:$issue" >/dev/null 2>&1; then
            echo "$ref: worktree issue:$issue não existe mais, pulando"
            continue
          fi

          case "$action" in
            revisar)
              prompt="Rode /review-pr $num e, quando o relatório estiver pronto, /review-pr --post $num. Se o --post pediu mudanças (qualquer comentário ancorado), marque: gh pr edit $num -R $repo --add-label agente:mudancas. Se a revisão não teve achado nenhum, NÃO ponha esse label; em vez disso traga a main (git fetch origin main && git merge origin/main), resolva os conflitos que houver, e mergeie: gh pr merge $num -R $repo --squash --delete-branch. Encerre com /review-pr --close $num. Faça por último, SEMPRE, aconteça o que acontecer: gh pr edit $num -R $repo --remove-label agente:rodando"
              ;;
            recheck)
              prompt="Rode /review-pr --check $num — o PR já foi revisado e depois corrigido, então é conferir item a item o que foi pedido, não revisar de novo. Se o veredito for 'pode aprovar', traga a main (git fetch origin main && git merge origin/main), resolva os conflitos que houver, mergeie com gh pr merge $num -R $repo --squash --delete-branch e rode /review-pr --close $num. Se ainda falta coisa, poste o que falta no PR e marque: gh pr edit $num -R $repo --add-label agente:mudancas. Faça por último, SEMPRE: gh pr edit $num -R $repo --remove-label agente:rodando"
              ;;
            corrigir)
              prompt="O PR $repo#$num recebeu pedidos de alteração numa revisão. Leia com: gh pr view $num -R $repo --comments e gh api repos/$repo/pulls/$num/comments. Aplique todas as sugestões pertinentes; das que não fizerem sentido, discorde por escrito na própria thread em vez de ignorar em silêncio. Rode os testes do projeto e só siga com tudo verde. Faça commit e push. Faça por último, SEMPRE: gh pr edit $num -R $repo --remove-label agente:mudancas --remove-label agente:rodando"
              ;;
          esac

          echo "→ $ref: $action"
          gh pr edit "$num" -R "$repo" --add-label agente:rodando >/dev/null
          if ! orca terminal create --worktree "issue:$issue" \
                 --title "$action #$num" \
                 --command "claude {{.CLAUDE_FLAGS}} \"$prompt\"" >/dev/null; then
            echo "  falhou ao abrir o terminal — soltando o lock"
            gh pr edit "$num" -R "$repo" --remove-label agente:rodando >/dev/null
          fi
        done
